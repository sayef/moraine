<svg xmlns="http://www.w3.org/2000/svg" width="400" height="308" viewBox="0 0 400 308" role="img" aria-labelledby="t d"><title id="t">Compaction of the tracker tables</title><desc id="d">Two bar charts, each with its own axis: compaction wall time in seconds and peak memory in megabytes for moraine, Lance and Delta Lake on local disk.</desc><style>@font-face{font-family:"Instrument Sans";font-weight:400 700;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}</style><rect x="16" y="15" width="10" height="10" rx="2" fill="#a87010"/><text x="31" y="24" font-size="13" fill="#cbbfa8">moraine</text><rect x="96.62" y="15" width="10" height="10" rx="2" fill="#5e97d0"/><text x="111.62" y="24" font-size="13" fill="#cbbfa8">Lance</text><rect x="164.24" y="15" width="10" height="10" rx="2" fill="#2e669c"/><text x="179.24" y="24" font-size="13" fill="#cbbfa8">Delta Lake</text><text x="16" y="60" font-size="15" fill="#f6f0e4" font-weight="600">Compaction time</text><text x="16" y="79" font-size="13" fill="#a69881">s, median; lower is better; runs of 18 Nov and 19 Nov</text><text x="16" y="104" font-size="14" fill="#cbbfa8">moraine</text><g><title>moraine: 2.63 s, median of 3, range 2.59–2.69 (19 Nov run)</title><rect x="94.4" y="89" width="243.91" height="20" fill="transparent"/><path d="M94.4 92H177.92A4 4 0 0 1 181.92 96V102A4 4 0 0 1 177.92 106H94.4Z" fill="#a87010"/></g><text x="187.92" y="104" font-size="14" fill="#f6f0e4">2.63 s</text><text x="16" y="126" font-size="14" fill="#cbbfa8">Lance</text><g><title>Lance: 7.33 s, median of 3, range 7.17–7.43 (18 Nov run)</title><rect x="94.4" y="111" width="243.91" height="20" fill="transparent"/><path d="M94.4 114H334.31A4 4 0 0 1 338.31 118V124A4 4 0 0 1 334.31 128H94.4Z" fill="#5e97d0"/></g><text x="344.31" y="126" font-size="14" fill="#f6f0e4">7.33 s</text><text x="16" y="148" font-size="14" fill="#cbbfa8">Delta Lake</text><g><title>Delta Lake: 4.88 s, median of 3, range 4.7–5.33 (19 Nov run)</title><rect x="94.4" y="133" width="243.91" height="20" fill="transparent"/><path d="M94.4 136H252.79A4 4 0 0 1 256.79 140V146A4 4 0 0 1 252.79 150H94.4Z" fill="#2e669c"/></g><text x="262.79" y="148" font-size="14" fill="#f6f0e4">4.88 s</text><line x1="94.4" y1="89" x2="94.4" y2="153" stroke="#a69881" stroke-width="1"/><text x="16" y="194" font-size="15" fill="#f6f0e4" font-weight="600">Peak memory</text><text x="16" y="213" font-size="13" fill="#a69881">MB, median; lower is better; runs of 18 Nov and 19 Nov</text><text x="16" y="238" font-size="14" fill="#cbbfa8">moraine</text><g><title>moraine: 264 MB, median of 3, range 262–267 (19 Nov run)</title><rect x="94.4" y="223" width="231.59" height="20" fill="transparent"/><path d="M94.4 226H159.88A4 4 0 0 1 163.88 230V236A4 4 0 0 1 159.88 240H94.4Z" fill="#a87010"/></g><text x="169.88" y="238" font-size="14" fill="#f6f0e4">264 MB</text><text x="16" y="260" font-size="14" fill="#cbbfa8">Lance</text><g><title>Lance: 880 MB, median of 3, range 798–901 (18 Nov run)</title><rect x="94.4" y="245" width="231.59" height="20" fill="transparent"/><path d="M94.4 248H321.99A4 4 0 0 1 325.99 252V258A4 4 0 0 1 321.99 262H94.4Z" fill="#5e97d0"/></g><text x="331.99" y="260" font-size="14" fill="#f6f0e4">880 MB</text><text x="16" y="282" font-size="14" fill="#cbbfa8">Delta Lake</text><g><title>Delta Lake: 356 MB, median of 3, range 344–381 (19 Nov run)</title><rect x="94.4" y="267" width="231.59" height="20" fill="transparent"/><path d="M94.4 270H184.09A4 4 0 0 1 188.09 274V280A4 4 0 0 1 184.09 284H94.4Z" fill="#2e669c"/></g><text x="194.09" y="282" font-size="14" fill="#f6f0e4">356 MB</text><line x1="94.4" y1="223" x2="94.4" y2="287" stroke="#a69881" stroke-width="1"/></svg>
