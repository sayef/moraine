name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug builds of delta-rs and DataFusion are large; keep the target directory small.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan the whole history for secrets
        env:
          GITLEAKS: "8.21.2"
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS
          curl -sSfLO "$base/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${GITLEAKS}_checksums.txt" | sha256sum -c --ignore-missing
          tar xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner -v .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The library with no features (the workspace run turns on what the test kit needs).
      - run: cargo clippy -p morainedb --all-targets -- -D warnings
      - run: cargo clippy -p morainedb -p moraine-testkit --all-targets --all-features -- -D warnings

  # The pre-commit hooks that need no Rust toolchain: spelling, workflows, file hygiene.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Spelling, workflows (actionlint, zizmor) and file hygiene
        env:
          # cargo fmt and clippy run in `lint`, gitleaks in `secrets`.
          SKIP: cargo-fmt,cargo-clippy,cargo-fmt-bench,gitleaks
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check -p morainedb --all-features

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    # Fails a hung run instead of holding the runner for the default six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Start an S3-compatible server (RustFS)
        run: |
          spike/s3-server.sh start
          spike/s3-server.sh env | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"
      - run: cargo test -p morainedb -p moraine-testkit
      - run: cargo test -p morainedb -p moraine-testkit --doc
      - run: cargo test -p morainedb --features aws-sdk --lib store::aws
      - run: cargo test -p moraine-testkit --features aws-sdk --test aws_sdk

  # A short simulation run in release mode: new seeds on every run of the workflow would make
  # failures hard to reproduce, so the range is fixed; longer runs are local (CONTRIBUTING.md).
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MORAINE_SIM_SEEDS: "2000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --release -p moraine-testkit --test toy_counter --test tables_sim --test mutations_sim --test txn_sim -- --nocapture

  macos:
    name: build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p morainedb --all-features
      - run: cargo test -p morainedb --all-features --no-run
